name: test-template

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate and test project
        run: make test
