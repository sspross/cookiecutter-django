name: test-template

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test-template:
    runs-on: ubuntu-latest

    # The generated project's worker tests perform a real RQ job.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate and test project
        run: make test
