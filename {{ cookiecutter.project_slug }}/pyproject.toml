[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}"}]
requires-python = ">=3.13,<3.15"
dependencies = [
	"django>=6.1,<6.2",
	"whitenoise",
	"django-environ",
	"psycopg[binary]",
	"django-vite",
	"django-ninja>=1.7",
	"django-rq>=4.2",
	"redis>=8",
]

[dependency-groups]
prod = [
	"gunicorn>=26",
]
dev = [
	"ruff",
	"pytest",
	"pytest-django",
	"pytest-cov",
	"factory-boy",
	"pre-commit",
	"playwright",
	"pytest-playwright",
	"pytest-timeout",
	"tach>=0.28.0",
	"pip-audit>=2.10.0",
	"deptry>=0.25.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-v --tb=short --tracing=retain-on-failure --screenshot=only-on-failure"
timeout = 120

[tool.coverage.run]
source = ["core", "api_keys", "users"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/asgi.py",
    "*/wsgi.py",
    "core/settings/*",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.deptry]
# Patterns are matched from the start of the path (re.match), so nested test
# dirs need an explicit `.*/` prefix — deptry's built-in `tests` exclude only
# catches a top-level tests/ directory.
extend_exclude = [
    # Test code legitimately imports dev-group tools (pytest, factory-boy,
    # playwright); scanning it would raise spurious DEP004 misplaced-dev errors.
    ".*/tests/.*",
]

[tool.deptry.per_rule_ignores]
# Declared runtime dependencies Django wires up through settings/URL strings or
# entry points rather than Python imports — deptry can't see those uses.
DEP002 = [
    "whitenoise",      # MIDDLEWARE + staticfiles STORAGES backend
    "django-vite",     # INSTALLED_APPS app: django_vite
    "django-rq",       # INSTALLED_APPS app + django_rq.urls
    "psycopg",         # PostgreSQL driver loaded by Django
    "redis",           # RQ broker, configured via RQ_QUEUES URL
]
