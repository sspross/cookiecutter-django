[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}"}]
requires-python = ">=3.13,<3.14"
dependencies = [
	"django>=6.0",
	"whitenoise",
	"django-environ",
	"psycopg2-binary",
	"django-vite",
	"django-ninja>=1.6.2",
	"django-rq>=4.1.0",
	"redis>=7.4.0",
]

[dependency-groups]
prod = [
	"gunicorn>=24.0",
]
dev = [
	"ruff",
	"pytest",
	"pytest-django",
	"pytest-cov",
	"factory-boy",
	"django-debug-toolbar",
	"pre-commit",
	"playwright",
	"pytest-playwright",
	"tach>=0.28.0",
	"pip-audit>=2.10.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-v --tb=short"
markers = [
     "browser: marks tests as browser tests using Playwright",
]
