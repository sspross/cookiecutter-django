[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}"}]
requires-python = ">=3.13,<3.15"
dependencies = [
	"django>=6.1,<6.2",
	"whitenoise",
	"django-environ",
	"psycopg[binary]",
	"django-vite",
	"django-ninja>=1.7",
	"django-rq>=4.2",
	"redis>=8",
	"sentry-sdk>=2.68",
	"django-allauth[socialaccount]>=65.19",
]

[dependency-groups]
prod = [
	"gunicorn>=26",
]
dev = [
	"ruff",
	"pytest",
	"pytest-django",
	"pytest-cov",
	"factory-boy",
	"pre-commit",
	"playwright",
	"pytest-playwright",
	"pytest-timeout",
	"pytest-xdist",
	"tach>=0.28.0",
	"pip-audit>=2.10.0",
	"deptry>=0.25.1",
	"responses",
	"mypy",
	"django-stubs[compatible-mypy]",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ANN",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "ANN"]
"**/tests/**" = ["ANN"]
"conftest.py" = ["ANN"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
explicit_package_bases = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["^core/frontend/"]

[[tool.mypy.overrides]]
module = ["allauth.*", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "core.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-v --tb=short --tracing=retain-on-failure --screenshot=only-on-failure"
timeout = 120

[tool.coverage.run]
source = ["core", "api_keys", "users"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/asgi.py",
    "*/wsgi.py",
    "core/settings/*",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.deptry]
# Patterns match from the path start (re.match), and deptry's built-in `tests`
# exclude only catches a top-level tests/, so nested dirs need the `.*/` prefix.
extend_exclude = [
    ".*/tests/.*",
    "conftest.py",
]

[tool.deptry.per_rule_ignores]
# Django and RQ load these from settings and URL strings, so deptry finds no import.
DEP002 = [
    "whitenoise",
    "django-vite",
    "django-rq",
    "psycopg",
    "redis",
]
