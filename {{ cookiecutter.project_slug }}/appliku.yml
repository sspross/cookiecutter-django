build_settings:
  build_image: dockerfile
  dockerfile_path: Dockerfile
  container_port: 8000
  expose_web_port: true
  environment_variables:
    - name: DEBUG
      value: "false"
    - name: DATABASE_URL
      from_database:
        name: db
        property: private_connection_url
    - name: REDIS_URL
      from_database:
        name: redis
        property: private_connection_url
    - name: ALLOWED_HOSTS
      from_domains: true
    - name: SECRET_KEY
      source: manual
    - name: SENTRY_DSN
      source: manual
    - name: GOOGLE_OAUTH_CLIENT_ID
      source: manual
    - name: GOOGLE_OAUTH_CLIENT_SECRET
      source: manual
    - name: SSO_ALLOWED_DOMAINS
      source: manual
    - name: SSO_ALLOWED_EMAILS
      source: manual
    - name: SSO_SUPERUSER_EMAILS
      source: manual

services:
  web:
    command: ./web.sh
    scale: 1
  worker:
    command: ./worker.sh
    scale: 1
  release:
    command: ./release.sh

databases:
  db:
    type: postgresql_17
  redis:
    type: redis_7

volumes:
  media:
    target: /volumes/media
    url: /media/
    # A prefix: Appliku injects <PREFIX>_ROOT and <PREFIX>_URL, which
    # core/settings/base.py reads as MEDIA_ROOT and MEDIA_URL.
    environment_variable: MEDIA
