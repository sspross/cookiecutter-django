name: pre-commit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: make frontend.install   # biome-check & tsc-typecheck hooks need core/frontend/node_modules
      - uses: pre-commit/action@v3.0.1
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --hook-stage manual --all-files
        # The schema-fresh hook boots Django to introspect the ninja API, so
        # settings must import. Only SECRET_KEY + DATABASE_URL lack defaults in
        # core/settings/base.py; the schema export never connects, so a
        # throwaway sqlite URL is enough.
        env:
          SECRET_KEY: ci-not-a-real-secret
          DATABASE_URL: sqlite:///db.sqlite3
