name: pre-commit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: uv sync --frozen
      - run: make frontend.install   # biome-check & tsc-typecheck hooks need core/frontend/node_modules
      - run: uv run pre-commit run --all-files
      - run: uv run pre-commit run --all-files --hook-stage manual
        # The schema-fresh hook boots Django to introspect the ninja API, so
        # settings must import. Only SECRET_KEY + DATABASE_URL lack defaults in
        # core/settings/base.py; the schema export never connects, so a
        # throwaway sqlite URL is enough.
        env:
          SECRET_KEY: ci-not-a-real-secret
          DATABASE_URL: sqlite:///db.sqlite3
