name: pre-commit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    # mypy's Django plugin and schema-fresh import core/settings/base.py, which has no
    # default for these two. Neither hook connects, so a throwaway sqlite URL is enough.
    env:
      SECRET_KEY: ci-not-a-real-secret
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: uv sync --frozen
      - run: make frontend.install
      - run: uv run pre-commit run --all-files
      - run: uv run pre-commit run --all-files --hook-stage manual
