name: image

on:
  push:
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Build image without pushing
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: "{% raw %}${{ github.actor }}{% endraw %}"
          password: "{% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}"

      - name: Derive image tags from the git tag
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: "{% raw %}ghcr.io/${{ github.repository }}{% endraw %}"
          # `latest=auto` keeps `:latest` off pre-release tags such as `v2.0.0-rc1`.
          flavor: latest=auto
          tags: "{% raw %}type=semver,pattern={{version}}{% endraw %}"

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          tags: "{% raw %}${{ steps.meta.outputs.tags }}{% endraw %}"
          labels: "{% raw %}${{ steps.meta.outputs.labels }}{% endraw %}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
