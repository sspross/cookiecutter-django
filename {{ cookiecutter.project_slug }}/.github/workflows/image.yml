name: image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pull requests only prove the image still builds; main pushes it.
      PUSH: {% raw %}${{ github.event_name == 'push' }}{% endraw %}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: "{% raw %}${{ github.actor }}{% endraw %}"
          password: "{% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}"

      - name: Derive image tags from the commit
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: "ghcr.io/{% raw %}${{ github.repository }}{% endraw %}"
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build image, push on main
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: "{% raw %}${{ env.PUSH == 'true' }}{% endraw %}"
          tags: "{% raw %}${{ steps.meta.outputs.tags }}{% endraw %}"
          labels: "{% raw %}${{ steps.meta.outputs.labels }}{% endraw %}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One plain manifest per tag. With provenance, buildx pushes an index whose
          # children show up as untagged versions on GHCR, and a version cleanup that
          # removes untagged versions breaks the tagged image (actions/delete-package-versions#162).
          provenance: false

      # GHCR never expires versions itself, and private packages count against the owner's quota.
      - name: Keep the newest 10 image versions
        if: env.PUSH == 'true'
        uses: actions/delete-package-versions@v5
        with:
          owner: "{% raw %}${{ github.repository_owner }}{% endraw %}"
          package-name: "{% raw %}${{ github.event.repository.name }}{% endraw %}"
          package-type: container
          min-versions-to-keep: 10
