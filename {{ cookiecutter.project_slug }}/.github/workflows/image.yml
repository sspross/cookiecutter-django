name: image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUSH: {% raw %}${{ github.event_name == 'push' }}{% endraw %}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "{% raw %}${{ github.actor }}{% endraw %}"
          password: "{% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}"

      - name: Derive image tags from the commit
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: "ghcr.io/{% raw %}${{ github.repository }}{% endraw %}"
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build image, push on main
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: "{% raw %}${{ env.PUSH == 'true' }}{% endraw %}"
          tags: "{% raw %}${{ steps.meta.outputs.tags }}{% endraw %}"
          labels: "{% raw %}${{ steps.meta.outputs.labels }}{% endraw %}"
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # With provenance, buildx pushes an index whose children GHCR lists as untagged,
          # so the cleanup below breaks the tagged image (actions/delete-package-versions#162).
          provenance: false

      - name: Keep the newest 10 image versions
        if: env.PUSH == 'true'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          owner: "{% raw %}${{ github.repository_owner }}{% endraw %}"
          package-name: "{% raw %}${{ github.event.repository.name }}{% endraw %}"
          package-type: container
          min-versions-to-keep: 10
