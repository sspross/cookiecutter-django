repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.9
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        name: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: tach
        name: tach
        entry: uv run tach check
        language: system
        pass_filenames: false
        always_run: true
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        always_run: true
      - id: pip-audit
        name: pip-audit
        entry: uv run python scripts/pip_audit_fixable.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [manual]
      - id: schema-fresh
        name: schema-fresh (generated API client up to date)
        entry: bash scripts/check_schema_fresh.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
      - id: biome-check
        name: biome-check (core/frontend)
        entry: bash -c 'cd core/frontend && npx --no-install biome check --write --no-errors-on-unmatched src vite.config.mjs'
        language: system
        files: ^core/frontend/(src/|vite\.config\.mjs|biome\.json|package\.json|tsconfig).*
        pass_filenames: false
      - id: tsc-typecheck
        name: tsc typecheck (core/frontend)
        entry: bash -c 'cd core/frontend && npx --no-install tsc --noEmit'
        language: system
        files: ^core/frontend/(src/|tsconfig).*\.(ts|tsx|json)$
        pass_filenames: false
