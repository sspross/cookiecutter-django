# Auto-loaded dev override.
#
# Starts only Postgres in dev. Django and Vite run on the host so file
# watching, debugger attachment, and fast reloads stay native. The Vite dev
# server proxies `/api`, `/admin`, `/media`, and `/static` to Django on
# `127.0.0.1:8000`, so the SPA at `http://localhost:5173` sees one origin.
services:
  postgres:
    ports:
      - "5432:5432"

  # Don't start the app container in dev — Django runs on the host.
  app:
    profiles: ["never"]
