---
id: no-biome-ignore-ts
language: typescript
severity: error
message: >-
  biome-ignore is allowed only under src/spa/hooks/. Fix the cause or move the
  code into a hook under @/hooks.
rule:
  kind: comment
  regex: '^(//|/\*)\s*biome-ignore\b'
ignores: ["**/schema.d.ts", "**/components/ui/**", "**/src/spa/hooks/**"]
---
