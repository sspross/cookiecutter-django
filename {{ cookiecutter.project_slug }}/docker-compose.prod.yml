# Explicit prod overlay. Apply with:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Brings up `app` + `postgres` and exposes the gunicorn port on the host so
# the operator's external reverse proxy (Caddy, nginx, Cloudflare Tunnel,
# etc.) can reach it. See the README's "Stage Deployment" section for a
# Caddyfile snippet covering TLS, the media bind-mount, and `Host`
# forwarding.
services:
  postgres:
    ports: !reset []

  app:
    ports:
      - "${APP_PORT:-8000}:8000"
