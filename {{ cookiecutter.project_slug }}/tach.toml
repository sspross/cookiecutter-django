exclude = [
    "**/__pycache__",
    "**/tests/**",
    "**/test_*",
    "**/migrations/**",
    "**/management/**",
    "manage.py",
]
exact = false
ignore_type_checking_imports = true  # tach cannot check guard direction, see docs/adr/0005-tach-boundaries.md
forbid_circular_dependencies = true

[[modules]]
path = "core"
depends_on = ["api_keys", "users"]

[[modules]]
path = "api_keys"
depends_on = []

[[modules]]
path = "users"
depends_on = []
